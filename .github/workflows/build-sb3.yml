name: Build Scratch SB3
on:
  push:
    paths:
      - ".build-ready"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Build SB3
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo
          cd repo
          cat .build/chunk-*.b64 > .build/all.b64
          base64 -d .build/all.b64 > catch-game.sb3
          rm -rf .build .build-ready
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Catch the Stars SB3"
          git push
